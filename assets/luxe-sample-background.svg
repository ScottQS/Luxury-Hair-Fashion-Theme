<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="0.45" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 260) rotate(90) scale(520 980)">
      <stop stop-color="#CFAE77" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#CFAE77" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 1860) rotate(90) scale(700 980)">
      <stop stop-color="#B38B4F" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#B38B4F" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="2400" fill="url(#bg)"/>
  <rect width="1200" height="2400" fill="url(#glowTop)"/>
  <rect width="1200" height="2400" fill="url(#glowBottom)"/>
  <g opacity="0.16" stroke="#E5C58C" stroke-width="1">
    <path d="M0 240h1200"/>
    <path d="M0 960h1200"/>
    <path d="M0 1520h1200"/>
    <path d="M0 2080h1200"/>
  </g>
  <rect width="1200" height="2400" filter="url(#noise)"/>
</svg>
